version: 2

project_name: jira-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: jira-cli
    main: ./cmd/jira
    binary: jira
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/caiocesarps/jira-cli/internal/version.Version={{.Version}}
      - -X github.com/caiocesarps/jira-cli/internal/version.Commit={{.Commit}}
      - -X github.com/caiocesarps/jira-cli/internal/version.Date={{.Date}}

archives:
  - id: jira-cli
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^style:'
      - '^chore:'
      - '^test:'
      - '^ci:'
      - '^build:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^feat[\w\-\(]*:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix[\w\-\(]*:'
      order: 1
    - title: Refactoring
      regexp: '^refactor[\w\-\(]*:'
      order: 2
    - title: Performance
      regexp: '^perf[\w\-\(]*:'
      order: 3
    - title: Others
      order: 999

release:
  github:
    owner: caiocesarps
    name: jira-cli
  draft: false
  prerelease: auto
  name_template: '{{ .ProjectName }} {{ .Version }}'
